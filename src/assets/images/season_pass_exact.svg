<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 190" width="100%" height="100%" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <!-- Card Background Gradient -->
    <linearGradient id="purpleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7e22ce"/>
      <stop offset="40%" stop-color="#9333ea"/>
      <stop offset="80%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>

    <!-- Metallic Silver Emblem Gradient -->
    <linearGradient id="silverMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#f1f5f9"/>
      <stop offset="70%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <linearGradient id="silverDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Subdued Tech Lines -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Outer Card Body with Rounded Corners -->
  <rect x="4" y="4" width="312" height="182" rx="16" fill="url(#purpleBg)" stroke="#f5d0fe" stroke-width="2" />
  <rect x="4" y="4" width="312" height="182" rx="16" fill="url(#grid)" />

  <!-- Top White Header Bar -->
  <path d="M 4 20 A 16 16 0 0 1 20 4 L 300 4 A 16 16 0 0 1 316 20 L 316 44 L 4 44 Z" fill="#ffffff" />
  
  <!-- "BLOOD STRIKE" Header Text -->
  <text x="18" y="31" font-family="'Oswald', 'Arial Black', sans-serif" font-size="13" font-weight="900" fill="#0f172a" letter-spacing="2.5">BLOOD STRIKE</text>

  <!-- Side Tech Notch Accents -->
  <rect x="8" y="65" width="4" height="60" rx="2" fill="#d8b4fe" opacity="0.6"/>
  <rect x="308" y="65" width="4" height="60" rx="2" fill="#d8b4fe" opacity="0.6"/>

  <!-- Hexagon Background Pattern behind Logo -->
  <polygon points="85,60 125,82 125,128 85,150 45,128 45,82" fill="#3b0764" opacity="0.4" stroke="#d8b4fe" stroke-width="1.5" />

  <!-- Silver "S" Emblem (Blood Strike Logo) -->
  <!-- Top Arm of S -->
  <polygon points="118,72 48,108 112,122 138,110" fill="url(#silverMetal)" stroke="#ffffff" stroke-width="1" />
  <polygon points="48,108 112,122 78,152 62,118" fill="url(#silverDark)" />
  <!-- Bottom Arm of S -->
  <polygon points="68,122 118,156 78,172 58,138" fill="url(#silverMetal)" />

  <!-- "SEASON" Main Text -->
  <text x="148" y="118" font-family="'Oswald', 'Impact', sans-serif" font-size="37" font-weight="900" fill="#ffffff" letter-spacing="2" filter="drop-shadow(0px 3px 6px rgba(0,0,0,0.5))">SEASON</text>
</svg>
